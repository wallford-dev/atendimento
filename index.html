<script>
(function () {
  var NUMERO = "5511991356610";
  function ler(nome) {
    try { return new URLSearchParams(window.location.search).get(nome) || ""; }
    catch (e) { return ""; }
  }
  // Aceita ?d=104582-Ricardo (uma variável só, formato da Meta) ou ?p=104582&n=Ricardo
  var pedido = ler("p"), cliente = ler("n"), d = ler("d");
  if (d) {
    var i = d.indexOf("-");
    if (i > -1) { pedido = d.slice(0, i); cliente = d.slice(i + 1); }
    else { pedido = d; }
  }
  pedido = pedido.replace(/[^0-9A-Za-z]/g, "").slice(0, 20);
  cliente = cliente.replace(/\+/g, " ").replace(/[^A-Za-zÀ-ÿ' -]/g, "").trim().split(/\s+/)[0] || "";
  cliente = cliente.slice(0, 30);
  if (cliente) cliente = cliente.charAt(0).toUpperCase() + cliente.slice(1).toLowerCase();

  var msg;
  if (cliente && pedido) msg = "Olá, sou " + cliente + " e tenho uma dúvida sobre o pedido nº " + pedido + ".";
  else if (pedido)       msg = "Olá, tenho uma dúvida sobre o pedido nº " + pedido + ".";
  else if (cliente)      msg = "Olá, sou " + cliente + " e tenho uma dúvida.";
  else                   msg = "Olá, tenho uma dúvida sobre o meu pedido.";
  var link = "https://wa.me/" + NUMERO + "?text=" + encodeURIComponent(msg);

  // Redireciona na hora, antes de carregar fontes ou imagens
  window.location.replace(link);

  // Se o WhatsApp não abrir, a página fica como reserva com o botão já pronto
  document.addEventListener("DOMContentLoaded", function () {
    document.getElementById("botao").href = link;
    if (cliente) document.getElementById("titulo").textContent = cliente + ", o Concierge Wallford está à sua disposição";
    if (pedido)  document.getElementById("texto").textContent = "Pedido nº " + pedido + ". Toque no botão para iniciar a conversa pelo WhatsApp.";
  });
})();
</script>
